    <!-- Navigasi -->

            </ul>
        </div>

    <!-- Contact Section -->
    <section class="contact">
        <div class="container">

            <h1>Hubungi Saya</h1>

            <div class="contact-content">

                <div class="contact-info">
                    <h2>Kontak</h2>

                    <p>
                        Jika ingin menghubungi saya, silakan isi formulir
                        yang tersedia.
                    </p>

                    <p>
                        <strong>Email:</strong> nbilapract@email.com
                    </p>

                    <p>
                        <strong>Telepon:</strong> 0857-5440-2279
                    </p>
                </div>

                <form class="contact-form">

                    <label for="name">Nama</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Masukkan nama"
                        required
                    >

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Masukkan email"
                        required
                    >

                    <label for="message">Pesan</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Tulis pesan Anda"
                        required
                    ></textarea>

                    <button type="submit" class="btn">
                        Kirim Pesan
                    </button>

                </form>

            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer>
    <div class="footer-content">

        <h3>MyPortofolio</h3>

        <div class="footer-links">

            <a href="mailto:nabilapract@email.com" class="footer-item">

                <span>Instagram</span>
            </a>

            <a href="https://github.com/NabilaPracita" target="_blank" class="footer-item">

            </a>

        </div>
