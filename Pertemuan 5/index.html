<!doctype html>
<html lang="en">
  <head>
    <title>Kalkulator Sederhana</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background: #f0f8ff;
      }
      .kalkulator {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      input {
        padding: 10px;
        margin: 5px;
        font-size: 16px;
        width: 80%;
        box-sizing: border-box;
      }
      button {
        padding: 10px 15px;
        margin: 5px;
        font-size: 16px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background: #298069;
      }
      .hasil {
        font-size: 28px;
        font-weight: bold;
        color: #2c3e50;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="kalkulator">
      <h2>Kalkulator</h2>

      <input
        type="number"
        id="angkal"
        placeholder="Masukkan Angka
Pertama"
      /><br />
      <input
        type="number"
        id="angka2"
        placeholder="Masukkan Angka
Kedua"
      /><br /><br />
      <button onclick="tambah()">+</button>
      <button onclick="kurang()">-</button>
      <button onclick="kali()">×</button>
      <button onclick="bagi()">÷</button>
      <button onclick="reset()" style="background: #e74c3c;">Reset</button>

      <div class="hasil"> Hasil : <span id="hasilAngka">0</span>
    </div>

    <script>
        //Penjelasan : document.getElementById diunakan untuk mengambil nilai dari tag HTML
        function tambah() {
            let a = parseFloat(document.getElementById('angkal').value);
            let b = parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerText = a + b;
        }

        function kurang() {
            let a = parseFloat(document.getElementById('angkal').value);
            let b = parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerText = a - b;
        }

        function kali() {
            let a = parseFloat(document.getElementById('angkal').value);
            let b = parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerText = a * b;
        }

        function bagi() {
            let a = parseFloat(document.getElementById('angkal').value);
            let b = parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerText = a / b;

            //Validasi pembagian dengan angka nol
            if (b === 0) {
                document.getElementById('hasilAngka').innerText = 'Error: Tidak bisa membagi dengan nol';
                return;
            }
            document.getElementById('hasilAngka').innerText = a / b;
        }

        function reset() {
            document.getElementById('angkal').value = '';
            document.getElementById('angka2').value = '';
            document.getElementById('hasilAngka').innerText = '0';
        }
    </script>
    </div>
  </body>
</html>
